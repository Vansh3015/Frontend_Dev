<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <Link rel="Stylesheet" href="style.css">
</head>
<body>
    <div>
        <table border="1" cellspacing="20" cellpadding="10" align="center">
        <tr>
        <td colspan="4" align="right">0</td>
        </tr>
        <tr>
        <td>AC</td>
        <td>+-</td>
        <td>%</td>
        <td>/</td>
        </tr>
        <tr>
        <td>7</td>
        <td>8</td>
        <td>9</td>
        <td>x</td>
        </tr>
        <tr>
        <td>4</td>
        <td>5</td>
        <td>6</td>
        <td>-</td>
        </tr>
        <tr>
        <td>1</td>
        <td>2</td>
        <td>3</td>
        <td>+</td>
        
        </tr>
        <tr>
        <td colspan="2">0</td>
        <td>.</td>
        <td rowspan="1">=</td>
        </tr>
    </table>
  </div>
</body>
</html>
