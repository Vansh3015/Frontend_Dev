<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown Selection</title>
</head>
<body>
    <h1>Choose Your Travel Preferences</h1>

    <form>
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="france" selected>France</option>
            <option value="japan">Japan</option>
            <option value="indonesia">Indonesia</option>
        </select><br><br>

        <label for="state">State:</label>
        <select id="state" name="state">
            <option value="ile-de-france" selected>Ile-de-France</option>
            <option value="kyoto">Kyoto</option>
            <option value="bali">Bali</option>
        </select><br><br>

        <label for="city">City:</label>
        <select id="city" name="city">
            <option value="paris" selected>Paris</option>
            <option value="kyoto-city">Kyoto</option>
            <option value="denpasar">Denpasar</option>
        </select><br><br>

        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option value="eiffel" selected>Eiffel Tower</option>
            <option value="fushimi">Fushimi Inari</option>
            <option value="ubud">Ubud</option>
        </select>
    </form>

    <p>You have selected: France, Ile-de-France, Paris, Eiffel Tower.</p>
</body>
</html>
