<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conference Schedule</title>
</head>
<body>
    <header>
        <h1>Annual Tech Conference 2025</h1>
    </header>

    <main>
        <table border="1">
            <caption>Conference Schedule</caption>
            <thead>
                <tr>
                    <th>Session</th>
                    <th>Time</th>
                    <th>Topic</th>
                    <th>Speaker</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Morning</td>
                    <td>9:00 AM - 12:00 PM</td>
                    <td>AI and Machine Learning</td>
                    <td>Dr. Arijit</td>
                </tr>
                <tr>
                    <td>Afternoon</td>
                    <td>1:00 PM - 4:00 PM</td>
                    <td>Cloud Computing</td>
                    <td>Ms. Badal</td>
                </tr>
                <tr>
                    <td>Evening</td>
                    <td>4:30 PM - 6:00 PM</td>
                    <td>Cybersecurity Trends</td>
                    <td>Mr. Cyber King</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="4">All sessions held in EC Conference Hall AB-2</td>
                </tr>
            </tfoot>
        </table>
    </main>
</body>
</html>
